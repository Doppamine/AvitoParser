{% extends "monitor/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="mx-auto mt-5" style="max-width: 22rem">
  <h1 class="h5 mb-3">Цены конкурентов</h1>

  {% if form.errors %}
    <div class="alert alert-danger py-1 px-2">
      Неверный логин или пароль.
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-2">
      <label class="form-label mb-0 small text-muted" for="{{ form.username.id_for_label }}">Логин</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}"
             class="form-control form-control-sm" autofocus required
             value="{{ form.username.value|default:'' }}">
    </div>
    <div class="mb-3">
      <label class="form-label mb-0 small text-muted" for="{{ form.password.id_for_label }}">Пароль</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}"
             class="form-control form-control-sm" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-sm btn-primary">Войти</button>
  </form>
</div>
{% endblock %}
