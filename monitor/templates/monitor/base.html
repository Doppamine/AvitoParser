<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Цены{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Плотность важнее красоты: на квартиру может прийтись сотня конкурентов. */
    body { font-size: .875rem; }
    table.prices { font-size: .8125rem; }
    table.prices thead th { position: sticky; top: 0; z-index: 3; background: #fff; }
    table.prices td, table.prices th { padding: .2rem .4rem; vertical-align: top; }
    table.prices td.name, table.prices th.name { position: sticky; left: 0; background: #fff; z-index: 2; max-width: 22rem; }
    table.prices thead th.name { z-index: 4; }
    tr.ours td { background: #e7f1ff !important; font-weight: 600; }
    td.cheaper { background: #fff3cd; }
    tr.inactive td { opacity: .55; }
    .price { font-variant-numeric: tabular-nums; }
    .note { display: block; font-size: .6875rem; line-height: 1.1; color: #6c757d; }
    th.weekend { background: #f8f9fa; }
    .dash { color: #adb5bd; cursor: help; }
  </style>
</head>
<body class="p-3">
{% if messages %}
  <div class="mb-2">
    {% for message in messages %}
      <div class="alert alert-{{ message.level_tag }} py-1 px-2 mb-1">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
